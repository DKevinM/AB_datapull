name: "04 · Generate IDW Grids (Hourly)"

on:
  schedule:
    - cron: "15 * * * *"   # Hourly at :15 (after live data is likely processed)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-grids:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Interpolate — Alberta (AQHI)
        run: python scripts/interpolate_grid.py --region AB

      - name: Interpolate — ACA airshed
        run: python scripts/interpolate_grid.py --region ACA

      - name: Interpolate — PAZA airshed
        run: python scripts/interpolate_grid.py --region PAZA

      - name: Interpolate — PAS airshed
        run: python scripts/interpolate_grid.py --region PAS

      - name: Interpolate — Saskatchewan (PM2.5)
        run: python scripts/interpolate_grid.py --region SK

      - name: Commit grid outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/output/*_grid.geojson data/output/*_idw.csv || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: IDW grids $(date -u +'%Y-%m-%dT%H:%M')Z"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main
          fi
