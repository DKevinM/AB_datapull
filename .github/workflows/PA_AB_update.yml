name: PA_AB_update

on:
#  schedule:
    # Run every 30 minutes
#    - cron: '*/30 * * * *'
  workflow_dispatch:  # Allow manual triggers
  # push:
  #  branches: [ main ]
  #  paths:
  #    - 'scripts/**'
  #    - '.github/workflows/**'
  #    - 'AB_PA_latest.py'
  #    - 'data/AB_PA_sensors.csv'  
  #    - 'data/dead_list.csv'     

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}  # Important for push
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests pytz supabase
        
    - name: Run PurpleAir data collection
      run: python AB_PA_latest.py
      env:
        PURPLEAIR_API_KEY: ${{ secrets.PURPLEAIR_API_KEY }}
        SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    
    - name: Build estimated AQHI
      run: python scripts/build_eAQHI.py
  

    - name: Commit and push if data changed
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
    
        git add data/AB_PM25_map.json data/eAQHI_map.json
    
        if git diff --staged --quiet; then
          echo "No changes detected"
        else
          echo "Changes detected, committing..."
          git commit -m "Update PurpleAir + eAQHI $(date +'%Y-%m-%d %H:%M')"
          git push
        fi        
