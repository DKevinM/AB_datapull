name: Historical PurpleAir Data

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: true
        default: '2025-01-01'
      end_date:
        description: 'End date (YYYY-MM-DD)' 
        required: true
        default: '2025-02-01'

jobs:
  historical-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        pip install pandas requests pytz
        
    - name: Run historical data collection
      env:
        PURPLEAIR_API_KEY: ${{ secrets.PURPLEAIR_API_KEY }}
      run: |
        python scripts/historical_purpleair.py --start-date ${{ github.event.inputs.start_date }} --end-date ${{ github.event.inputs.end_date }}
        
    - name: Upload historical data as artifact
      uses: actions/upload-artifact@v4
      with:
        name: historical-data
        path: data/historical_*.csv
