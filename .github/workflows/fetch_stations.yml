name: Fetch Station Data

on:
  schedule:
    - cron: '5 9 * * *'  # Runs every day at 9:05
  workflow_dispatch:     # Allows manual trigger from GitHub UI

jobs:
  run-script:
    runs-on: ubuntu-latest

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests SQLAlchemy python-dotenv psycopg2-binary

      - name: Run AQHI fetch/push script
        run: python fetch_stations.py
        
      - name: Sanity check row count
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          eng = create_engine(os.environ["SUPABASE_DB_URL"])
          with eng.begin() as conn:
              n = conn.execute(text('select count(*) from public.stations')).scalar_one()
              print(f"stations rows now: {n}")
          PY
