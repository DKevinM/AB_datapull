name: Fetch and Push AQHI Data

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour at 00 minutes
  workflow_dispatch:     # Allows manual trigger from GitHub UI

jobs:
  run-script:
    runs-on: ubuntu-latest

    env:
      DB_DKEV: ${{ secrets.DB_DKEV }}
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests sqlalchemy psycopg2-binary

      - name: Show public IP of GitHub runner
        run: curl https://ifconfig.me
        
      - name: Run AQHI fetch/push script
        run: python fetch_push.py
