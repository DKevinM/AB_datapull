name: Compare AB and ECCC AQHI

on:
#  schedule:
#    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare-aqhi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install requests pandas beautifulsoup4 lxml

      - name: Run AQHI comparison
        run: |
          python scripts/compare_ab_eccc_aqhi.py

      - name: Commit updated comparison files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/aqhi_comparison/*.csv
          git commit -m "Update AB vs ECCC AQHI comparison" || echo "No changes"
          git push
