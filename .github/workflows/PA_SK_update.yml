name: PA_SK_update

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:  # Allow manual triggers
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'SK_PA_latest.py'
      - 'dataSK/SK_PA_sensors.csv'  
     

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}  # Important for push
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests pytz supabase
        
    - name: Run PurpleAir data collection
      run: python SK_PA_latest.py
      env:
        PURPLEAIR_API_KEY: ${{ secrets.PURPLEAIR_API_KEY }}
        SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

    - name: Commit and push if data changed
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
    
        git add dataSK/SK_PM25_map.json
       
