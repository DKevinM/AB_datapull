name: Update PAZA PurpleAir Sensor List

on:
#  schedule:
#    - cron: '0 6 * * *'  # Run every day at 6 AM UTC
  workflow_dispatch:     # Allow manual run via GitHub Actions UI

permissions:
  contents: write
  
jobs:
  update-sensors:
    runs-on: ubuntu-latest

    env:
      PURPLEAIR_API_KEY: ${{ secrets.PURPLEAIR_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas geopandas shapely requests

      - name: Run PurpleAir region script
        run: |
          python PAZA_PA_latest.py
          # Safety net: ensure data dir and file exist even if script bailed early
          mkdir -p data
          [ -f data/PAZA_PM25_map.json ] || echo "[]" > data/PAZA_PM25_map.json

      - name: Commit and push CSV
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add data/PAZA_sensors.csv
          git commit -m "Daily update: PAZA_sensors.csv"
          git push
