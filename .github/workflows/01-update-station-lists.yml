name: "01 · Update Station Lists (Daily)"

on:
  schedule:
    - cron: "0 0 * * *"   # Daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stations:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update AQHI + PurpleAir station lists
        run: python scripts/update_station_lists.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PURPLEAIR_API_KEY: ${{ secrets.PURPLEAIR_API_KEY }}

      - name: Commit updated sensor lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/station_list.csv data/AB_PA_sensors.csv dataSK/SK_PA_sensors.csv || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update station/sensor lists $(date -u +'%Y-%m-%d')"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main
          fi
