name: push every hour
on:
#  schedule:
#    - cron: "5 * * * *"   # every hour at :05 (UTC)
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; \
          else pip install requests pandas SQLAlchemy psycopg2-binary; fi
      - name: Run fetch + push
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}          # Postgres connection string
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }} # if needed elsewhere
        run: |
          python fetch_push.py

